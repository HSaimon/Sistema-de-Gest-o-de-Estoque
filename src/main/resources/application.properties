spring.application.name=sistema-gestao-estoque

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/estoque_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

spring.cache.type=simple

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
